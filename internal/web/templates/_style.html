{{define "style"}}<style>
:root{--bg:#f5f6fa;--card:#fff;--fg:#1c1e26;--muted:#6b7080;--accent:#e5484d;--border:#e3e5ec;--chip:#fdecec}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#181b24;--fg:#eceef5;--muted:#9096a8;--accent:#ff6369;--border:#272b38;--chip:#2a1719}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:36px 28px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
.icon{width:72px;height:72px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 18px}
h1{font-size:22px;margin:0 0 10px}p{color:var(--muted);line-height:1.55;margin:0 0 6px;font-size:15px}
.file{margin:16px 0 4px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px dashed var(--border);font-size:14px;word-break:break-all}
.code{display:inline-block;margin-top:14px;font-size:12px;color:var(--muted);letter-spacing:.08em}
a.btn{display:inline-block;margin-top:20px;padding:11px 22px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:14px}
.foot{margin-top:22px;font-size:12px;color:var(--muted)}
</style>{{end}}
